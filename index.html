<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sybc's shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #151c2c;
      --surface-card: #1e293b;
      --primary: #f59e0b;
      --primary-hover: #d97706;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #22c55e;
      --radius: 16px;
      --shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 80px; min-height: 100vh; }

    /* Header */
    header {
      background: rgba(21, 28, 44, 0.8);
      backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .logo { font-size: 1.4rem; font-weight: 800; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 8px; }
    .logo span { color: var(--primary); }
    .nav-actions { display: flex; gap: 12px; }
    .icon-btn { background: var(--surface-card); border: 1px solid var(--border); color: #fff; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
    .icon-btn:hover { border-color: var(--primary); color: var(--primary); }

    /* Admin Bar */
    .admin-bar { background: var(--primary); color: #000; font-weight: 700; text-align: center; padding: 8px; font-size: 0.85rem; display: flex; justify-content: center; align-items: center; gap: 15px; }
    .admin-bar button { background: #000; color: #fff; border: none; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; cursor: pointer; }

    /* Hero Banner */
    .hero { text-align: center; padding: 40px 20px 20px; max-width: 800px; margin: 0 auto; }
    .hero h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 8px; }
    .hero p { color: var(--text-muted); font-size: 1rem; }

    /* Controls Section */
    .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
    .search-bar { margin: 20px 0; display: flex; gap: 10px; }
    .search-bar input { width: 100%; background: var(--surface); border: 1px solid var(--border); padding: 14px 18px; border-radius: var(--radius); color: #fff; font-size: 1rem; outline: none; }
    .search-bar input:focus { border-color: var(--primary); }

    /* Categories */
    .categories { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; scrollbar-width: none; }
    .cat-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); padding: 8px 18px; border-radius: 30px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: 0.2s; }
    .cat-btn.active, .cat-btn:hover { background: var(--primary); color: #000; border-color: var(--primary); }

    /* Product Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: transform 0.2s, border-color 0.2s; cursor: pointer; display: flex; flex-direction: column; }
    .card:hover { transform: translateY(-4px); border-color: var(--primary); }
    .card-img { width: 100%; height: 240px; object-fit: cover; background: var(--surface-card); }
    .card-body { padding: 16px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; }
    .card-price { font-size: 1.2rem; font-weight: 800; color: var(--primary); margin-top: auto; }

    /* Modal / Product View (Aurapedis Style) */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 15px; opacity: 0; pointer-events: none; transition: 0.3s ease; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); width: 100%; max-width: 850px; max-height: 90vh; overflow-y: auto; padding: 25px; position: relative; box-shadow: var(--shadow); }
    .close-btn { position: absolute; top: 15px; right: 15px; background: var(--surface-card); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; }

    /* Product Detail Layout */
    .p-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
    @media (max-width: 768px) { .p-detail { grid-template-columns: 1fr; } }
    .p-main-img { width: 100%; border-radius: var(--radius); object-fit: cover; max-height: 380px; }
    .p-title { font-size: 1.6rem; font-weight: 800; margin-bottom: 10px; }
    .p-price { font-size: 1.5rem; font-weight: 800; color: var(--primary); margin-bottom: 15px; }
    .p-desc { color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 20px; }
    .btn-buy { background: #25d366; color: #fff; font-weight: 700; font-size: 1.1rem; border: none; width: 100%; padding: 16px; border-radius: 30px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; transition: 0.2s; }
    .btn-buy:hover { background: #1eb954; }

    /* Features / Trust Badges */
    .badges { margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.85rem; color: var(--text-muted); }
    .badge-item { display: flex; align-items: center; gap: 8px; background: var(--surface-card); padding: 10px; border-radius: 8px; }

    /* Form Fields */
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; }
    .form-group input, .form-group textarea { width: 100%; background: var(--surface-card); border: 1px solid var(--border); padding: 12px; border-radius: 8px; color: #fff; font-size: 1rem; }

    /* Floating Add Button */
    .fab { position: fixed; bottom: 25px; right: 25px; background: var(--primary); color: #000; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: bold; box-shadow: 0 10px 20px rgba(245, 158, 11, 0.4); border: none; cursor: pointer; z-index: 90; display: none; }
  </style>
</head>
<body>

  <div id="adminBanner" class="admin-bar" style="display: none;">
    ⚡ Mode Gestion Actif
    <button onclick="logout()">Se Déconnecter</button>
  </div>

  <header>
    <a href="#" class="logo">Sybc's <span>shop</span></a>
    <div class="nav-actions">
      <button class="icon-btn" onclick="openLoginModal()" title="Administration">⚙️</button>
    </div>
  </header>

  <div class="hero">
    <h1>La ref de vos accessoires stylés</h1>
    <p>Commandez vos articles préférés directement via WhatsApp</p>
  </div>

  <div class="container">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Rechercher un produit..." oninput="filterProducts()">
    </div>

    <div class="categories" id="categoriesContainer">
      <button class="cat-btn active" onclick="filterCategory('all', this)">Tous</button>
    </div>

    <div class="grid" id="productsGrid"></div>
  </div>

  <button class="fab" id="fabAdd" onclick="openAddModal()">+</button>

  <!-- Product / Generic Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal-content" id="modalBody"></div>
  </div>

  <script>
    // CONFIGURATION GENERALE
    var ADMIN_PASSWORD = "7KJB8bnw";
    var PHONE_NUMBER = "237688630287";
    var CURRENCY = "FCFA";
    var SESSION_KEY = "sybc_admin_logged";

    var products = JSON.parse(localStorage.getItem('sybc_products')) || [
      {
        id: 1,
        title: "Montre De Luxe Minimaliste",
        price: 15000,
        category: "Montres",
        image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600",
        description: "Une montre élégante et moderne, résistante à l'eau avec un cadran renforcé. Parfaite pour toutes les occasions."
      }
    ];

    var isAdmin = sessionStorage.getItem(SESSION_KEY) === '1';
    var selectedCategory = 'all';

    function init() {
      if (isAdmin) {
        document.getElementById('adminBanner').style.display = 'flex';
        document.getElementById('fabAdd').style.display = 'flex';
      }
      renderCategories();
      renderProducts();
    }

    function saveProducts() {
      localStorage.setItem('sybc_products', JSON.stringify(products));
      renderCategories();
      renderProducts();
    }

    function renderCategories() {
      var cats = ['all'];
      products.forEach(p => { if(p.category && !cats.includes(p.category)) cats.push(p.category); });
      var html = '<button class="cat-btn ' + (selectedCategory === 'all' ? 'active' : '') + '" onclick="filterCategory(\'all\', this)">Tous</button>';
      cats.forEach(c => {
        if(c !== 'all') {
          html += `<button class="cat-btn ${selectedCategory === c ? 'active' : ''}" onclick="filterCategory('${c}', this)">${c}</button>`;
        }
      });
      document.getElementById('categoriesContainer').innerHTML = html;
    }

    function filterCategory(cat, btn) {
      selectedCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderProducts();
    }

    function renderProducts() {
      var grid = document.getElementById('productsGrid');
      var query = document.getElementById('searchInput').value.toLowerCase();
      var filtered = products.filter(p => {
        var matchCat = selectedCategory === 'all' || p.category === selectedCategory;
        var matchSearch = p.title.toLowerCase().includes(query);
        return matchCat && matchSearch;
      });

      if(filtered.length === 0) {
        grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color: var(--text-muted); margin-top: 30px;">Aucun produit trouvé.</p>';
        return;
      }

      grid.innerHTML = filtered.map(p => `
        <div class="card" onclick="viewProduct(${p.id})">
          <img src="${p.image}" class="card-img" alt="${p.title}" onerror="this.src='https://via.placeholder.com/300x240?text=Image+Indisponible'">
          <div class="card-body">
            <div class="card-title">${p.title}</div>
            <div class="card-price">${p.price.toLocaleString()} ${CURRENCY}</div>
          </div>
        </div>
      `).join('');
    }

    function filterProducts() { renderProducts(); }

    // AFFICHAGE PRODUIT STYLE AURAPEDIS
    function viewProduct(id) {
      var p = products.find(item => item.id === id);
      if(!p) return;

      var waMsg = encodeURIComponent(`Bonjour Sybc's shop, je souhaite commander :\n\n- *${p.title}*\n- Prix: ${p.price} ${CURRENCY}\n\nMerci de m'indiquer la disponibilité !`);
      var waUrl = `https://wa.me/${PHONE_NUMBER}?text=${waMsg}`;

      var html = `
        <button class="close-btn" onclick="closeModal()">✕</button>
        <div class="p-detail">
          <div>
            <img src="${p.image}" class="p-main-img" alt="${p.title}">
          </div>
          <div>
            <h2 class="p-title">${p.title}</h2>
            <div class="p-price">${p.price.toLocaleString()} ${CURRENCY}</div>
            <p class="p-desc">${p.description || 'Aucune description disponible.'}</p>
            
            <a href="${waUrl}" target="_blank" class="btn-buy">
              💬 Commander sur WhatsApp
            </a>

            <div class="badges">
              <div class="badge-item">⚡ Livraison rapide</div>
              <div class="badge-item">🔒 Paiement sécurisé</div>
              <div class="badge-item">💯 Qualité garantie</div>
              <div class="badge-item">📞 Support 24/7</div>
            </div>

            ${isAdmin ? `
              <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button onclick="deleteProduct(${p.id})" style="background:#ef4444; color:#fff; border:none; padding:10px 15px; border-radius:8px; cursor:pointer; font-weight:600;">Supprimer ce produit</button>
              </div>
            ` : ''}
          </div>
        </div>
      `;
      openModal(html);
    }

    // MODAL HANDLERS
    function openModal(content) {
      document.getElementById('modalBody').innerHTML = content;
      document.getElementById('modal').classList.add('active');
    }
    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    // ADMIN FUNCTIONS
    function openLoginModal() {
      var html = `
        <button class="close-btn" onclick="closeModal()">✕</button>
        <h2 style="margin-bottom: 15px;">Accès Administration</h2>
        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label>Mot de passe</label>
            <input type="password" id="passInput" required placeholder="Entrez le mot de passe">
          </div>
          <button type="submit" style="background:var(--primary); color:#000; border:none; width:100%; padding:12px; border-radius:8px; font-weight:700; cursor:pointer;">Connexion</button>
        </form>
      `;
      openModal(html);
    }

    function handleLogin(e) {
      e.preventDefault();
      var pass = document.getElementById('passInput').value;
      if(pass === ADMIN_PASSWORD) {
        sessionStorage.setItem(SESSION_KEY, '1');
        isAdmin = true;
        document.getElementById('adminBanner').style.display = 'flex';
        document.getElementById('fabAdd').style.display = 'flex';
        closeModal();
        renderProducts();
        alert("Connexion réussie !");
      } else {
        alert("Mot de passe incorrect !");
      }
    }

    function logout() {
      sessionStorage.removeItem(SESSION_KEY);
      isAdmin = false;
      document.getElementById('adminBanner').style.display = 'none';
      document.getElementById('fabAdd').style.display = 'none';
      renderProducts();
    }

    function openAddModal() {
      var html = `
        <button class="close-btn" onclick="closeModal()">✕</button>
        <h2 style="margin-bottom: 15px;">Ajouter un Produit</h2>
        <form onsubmit="handleAddProduct(event)">
          <div class="form-group">
            <label>Nom du produit</label>
            <input type="text" id="addTitle" required>
          </div>
          <div class="form-group">
            <label>Prix (${CURRENCY})</label>
            <input type="number" id="addPrice" required>
          </div>
          <div class="form-group">
            <label>Catégorie</label>
            <input type="text" id="addCategory" placeholder="ex: Accessoires, Sacs..." required>
          </div>
          <div class="form-group">
            <label>Lien de l'image (URL)</label>
            <input type="url" id="addImage" placeholder="https://..." required>
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea id="addDesc" rows="3"></textarea>
          </div>
          <button type="submit" style="background:var(--primary); color:#000; border:none; width:100%; padding:12px; border-radius:8px; font-weight:700; cursor:pointer;">Publier le produit</button>
        </form>
      `;
      openModal(html);
    }

    function handleAddProduct(e) {
      e.preventDefault();
      var newP = {
        id: Date.now(),
        title: document.getElementById('addTitle').value,
        price: parseFloat(document.getElementById('addPrice').value),
        category: document.getElementById('addCategory').value,
        image: document.getElementById('addImage').value,
        description: document.getElementById('addDesc').value
      };
      products.push(newP);
      saveProducts();
      closeModal();
    }

    function deleteProduct(id) {
      if(confirm("Voulez-vous vraiment supprimer ce produit ?")) {
        products = products.filter(p => p.id !== id);
        saveProducts();
        closeModal();
      }
    }

    init();
  </script>
</body>
</html>
